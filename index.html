<style>

/* Layout: mobile app shell — sticky header, one scrolling view, bottom tab bar; side drawer = full menu */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#E3E8E6; --ink:#0F1A17; --muted:#5B6B66; --line:#D3DBD8;
  --accent:#E8501A; --accent-soft:#FBE3D9; --accent-ink:#FFFFFF;
  --prot:#0E7C66; --carb:#B67C08; --fat:#6555C8; --fib:#3F7F2A;
  --good:#1F8A4C; --warn:#B86E00; --bad:#C2362B;
  --shadow:0 1px 2px rgba(15,26,23,.06),0 6px 20px rgba(15,26,23,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141E1B; --surface-2:#1C2825; --ink:#E6EEEB; --muted:#92A39D; --line:#283632;
  --accent:#FF6A33; --accent-soft:#3A1F14; --accent-ink:#1A0B05;
  --prot:#2BB596; --carb:#E0A82E; --fat:#9788F2; --fib:#7CC35E;
  --good:#3CC27A; --warn:#E9A33A; --bad:#F06B5E; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141E1B; --surface-2:#1C2825; --ink:#E6EEEB; --muted:#92A39D; --line:#283632;
  --accent:#FF6A33; --accent-soft:#3A1F14; --accent-ink:#1A0B05;
  --prot:#2BB596; --carb:#E0A82E; --fat:#9788F2; --fib:#7CC35E;
  --good:#3CC27A; --warn:#E9A33A; --bad:#F06B5E; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800;line-height:1.1}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-1px)}
.topbar .date{margin-left:auto;font-size:.8rem;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab.ai .bub{width:38px;height:38px;border-radius:13px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:-14px;box-shadow:var(--shadow)}
.tab.ai.on .bub{background:var(--accent);color:var(--accent-ink)}

.drawer-bg{position:fixed;inset:0;background:rgba(5,10,8,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--surface);z-index:41;transform:translateX(-102%);transition:transform .25s ease;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;overflow:auto}
.menu-open .drawer{transform:none}.menu-open .drawer-bg{opacity:1;pointer-events:auto}
.drawer .group{margin-top:14px;margin-bottom:4px}
.mitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:none;border:0;text-align:left;cursor:pointer;font-weight:600;width:100%}
.mitem svg{width:20px;height:20px;color:var(--muted)}
.mitem small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.mitem.on{background:var(--surface-2)}.mitem.on svg{color:var(--accent)}

/* cards & controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.card.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.hero .muted,.card.hero .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px 12px;font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.divider{height:1px;background:var(--line)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.thumb{width:48px;height:48px;border-radius:12px;background:var(--surface-2);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:22px;height:22px}

/* dashboard */
.ringwrap{display:flex;gap:18px;align-items:center}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:1.7rem;font-weight:800;line-height:1}
.macros{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 14%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:currentColor}
.mrow{display:flex;flex-direction:column;gap:4px}
.mrow .top{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;gap:8px}
.mrow .top span:last-child{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:.78rem}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:30px;height:38px;border-radius:6px 6px 9px 9px;border:2px solid var(--line);background:none;cursor:pointer;position:relative;overflow:hidden;padding:0}
.glass.full{border-color:#3B82C4;background:linear-gradient(to top,color-mix(in srgb,#3B82C4 55%,transparent) 80%,transparent 80%)}
.gapitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.gapitem:first-child{border-top:0}
.gapitem .lbl{font-weight:700;min-width:96px}
.gapitem .food{font-size:.85rem;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;background:var(--accent-soft);color:var(--ink);font-size:.86rem}
.banner b{color:var(--accent)}

/* workout */
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.ex .sr{font-family:var(--f-mono);font-size:.82rem;font-weight:600;white-space:nowrap;text-align:right}
.ex .alt{font-size:.8rem;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:16px;height:16px}

/* nutrients */
.nut{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;font-size:.86rem}
.nut .v{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);white-space:nowrap;text-align:right}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:var(--surface)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:11px;padding:8px;text-align:center}
.kv b{display:block;font-family:var(--f-mono);font-size:1rem}
.kv span{font-size:.7rem;color:var(--muted);font-weight:600}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.tool{align-self:flex-start;background:none;color:var(--muted);font-size:.78rem;padding:0 4px}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.composer form{max-width:608px;margin:0 auto;display:flex;gap:8px}
.composer input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line)}
.has-composer main{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spark{width:100%;height:90px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
ol.steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.stars{color:var(--carb);letter-spacing:1px;font-size:.85rem}
.logrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:.8rem}
.logrow input{width:64px;padding:6px 8px;font-size:15px}
.last{font-size:.76rem;color:var(--prot);font-weight:700}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .card{padding:12px;gap:4px;cursor:pointer}
.mini b{font-family:var(--f-display);font-size:1.3rem}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--fat)}
.bars span{font-size:.68rem;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat>div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.15rem}
.stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.stat em{font-style:normal;font-size:.72rem;font-weight:700}
